<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <!-- Eigenständige Ersatz-Illustration (kein Original-Asset): antike Sanduhr -->
  <defs>
    <radialGradient id="bg" cx=".5" cy=".46" r=".7">
      <stop offset="0" stop-color="#2b2117"/>
      <stop offset=".55" stop-color="#120e0a"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c4219"/>
      <stop offset=".28" stop-color="#e8cf96"/>
      <stop offset=".52" stop-color="#a77c3c"/>
      <stop offset=".8" stop-color="#d9bb7e"/>
      <stop offset="1" stop-color="#4d3713"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".02"/>
      <stop offset=".2" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".03"/>
      <stop offset=".85" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c690"/>
      <stop offset="1" stop-color="#a87a3f"/>
