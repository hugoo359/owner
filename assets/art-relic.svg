  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="600" cy="760" rx="330" ry="470" fill="#c6a46a" opacity=".12" filter="url(#blur30)"/>
  <ellipse cx="600" cy="1262" rx="330" ry="26" fill="#000" opacity=".8" filter="url(#blur4)"/>
  <g clip-path="url(#bulbs)">
